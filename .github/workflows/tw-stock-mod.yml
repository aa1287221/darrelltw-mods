name: tw-stock-mod checks

on:
  push:
    paths:
      - "mods/tw-stock-mod/**"
      - ".github/workflows/tw-stock-mod.yml"
  pull_request:
    paths:
      - "mods/tw-stock-mod/**"
      - ".github/workflows/tw-stock-mod.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mods/tw-stock-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest and ripgrep
        run: |
          python -m pip install --quiet pytest
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep
      # esbuild build, every offline harness, pytest, engine rules and the
      # personal-data scan; the two Yahoo-dependent harnesses are skipped
      - name: run-checks.sh
        run: bash scripts/dev/run-checks.sh
        env:
          SKIP_NETWORK: "1"
