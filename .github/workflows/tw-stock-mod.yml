name: tw-stock-mod checks

on:
  push:
    paths:
      - "mods/tw-stock-mod/**"
      - ".github/workflows/tw-stock-mod.yml"
  pull_request:
    paths:
      - "mods/tw-stock-mod/**"
      - ".github/workflows/tw-stock-mod.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mods/tw-stock-mod
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pytest, ripgrep and the claude CLI
        run: |
          python -m pip install --quiet pytest
          # `claude plugin validate` runs the engine's own load-time scan; no login needed
          # pinned: a new CLI can change what validate checks without a change here
          npm install -g --silent @anthropic-ai/claude-code@2.1.281
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep
      # esbuild build, every offline harness, pytest, engine rules, the
      # engine's own plugin validation and the personal-data scan; the two
      # Yahoo-dependent harnesses are skipped
      - name: run-checks.sh
        run: bash scripts/dev/run-checks.sh
        env:
          SKIP_NETWORK: "1"

  # The 群益 fetcher is Windows-only, and its pidfile guard asks the Windows
  # kernel (_common._windows_pid_alive) - a stub can only check the logic, so
  # the fetchers' Python suite also runs here against the real kernel32.
  windows-fetchers:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mods/tw-stock-mod
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: pytest (scripts/tests)
        run: python -m pytest scripts/tests -q -rs
